[project]
name = "popularity-map"
version = "0.1.0"
description = "Location Popularity Map REST API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]>=5.6,<5.7",
    "django>=5.2,<5.3",
    "django-filter>=25.1,<27",
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.30,<0.31",
    "gunicorn>=23,<27",
    "pandas>=2.3,<4",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<9",
]

[dependency-groups]
dev = [
    "freezegun>=1.5,<2",
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<0.18",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::django.utils.deprecation.RemovedInDjango60Warning",
]

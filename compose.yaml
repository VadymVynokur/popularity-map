name: popularity-map

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-popularity_map}
      POSTGRES_USER: ${POSTGRES_USER:-popularity_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popularity_map}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      POSTGRES_DB: ${POSTGRES_DB:-popularity_map}
      POSTGRES_USER: ${POSTGRES_USER:-popularity_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popularity_map}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_VIEW_COOLDOWN_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/1
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      DEFAULT_FROM_EMAIL: no-reply@popularity-map.local
      EMAIL_CONFIRMATION_URL: http://localhost:8000/api/v1/auth/email/confirm/
      PASSWORD_RESET_URL: http://localhost:8000/api/v1/auth/password/reset/confirm/
      API_DOCS_ENABLED: "true"
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  worker:
    build: .
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-popularity_map}
      POSTGRES_USER: ${POSTGRES_USER:-popularity_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popularity_map}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_VIEW_COOLDOWN_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/1
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      DEFAULT_FROM_EMAIL: no-reply@popularity-map.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  beat:
    build: .
    command: celery -A config beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-popularity_map}
      POSTGRES_USER: ${POSTGRES_USER:-popularity_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popularity_map}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_VIEW_COOLDOWN_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/1
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      DEFAULT_FROM_EMAIL: no-reply@popularity-map.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
